<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线数独游戏</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 id="title" data-translate="title">数独游戏</h1>
        <div class="game-controls">
            <button id="new-game" data-translate="newGame">新游戏</button>
            <button id="check" data-translate="check">检查答案</button>
            <button id="solve" data-translate="solve">显示答案</button>
            <select id="difficulty">
                <option value="easy" data-translate="easy">简单</option>
                <option value="medium" data-translate="medium">中等</option>
                <option value="hard" data-translate="hard">困难</option>
            </select>
        </div>
        <div id="sudoku-board"></div>
        <div class="number-panel">
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
            <button class="number-btn" data-number="9">9</button>
        </div>
        <div id="timer" data-translate="timer">时间: 00:00</div>
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
